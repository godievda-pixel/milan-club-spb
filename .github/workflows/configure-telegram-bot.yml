name: Configure Telegram Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/setup-bot.mjs
      - .github/workflows/configure-telegram-bot.yml

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure menu button
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MINI_APP_URL: https://milan-club-spb.ciao-web.workers.dev
          MENU_BUTTON_TEXT: Milan Club
        run: npm run configure-bot
