<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AC Milan Club San Pietroburgo</title>
  <script async src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <script>
    (function () {
      if (!Object.fromEntries) {
        Object.fromEntries = function (entries) {
          var obj = {};
          Array.from(entries).forEach(function (entry) { obj[entry[0]] = entry[1]; });
          return obj;
        };
      }
      if (!Promise.allSettled) {
        Promise.allSettled = function (items) {
          return Promise.all(Array.from(items).map(function (item) {
            return Promise.resolve(item).then(
              function (value) { return {status:'fulfilled', value:value}; },
              function (reason) { return {status:'rejected', reason:reason}; }
            );
          }));
        };
      }

      function nativeReady() {
        try {
          if (window.TelegramWebviewProxy && typeof window.TelegramWebviewProxy.postEvent === 'function') {
            window.TelegramWebviewProxy.postEvent('web_app_ready', '');
          } else if (window.external && typeof window.external.notify === 'function') {
            window.external.notify(JSON.stringify({eventType:'web_app_ready', eventData:null}));
          }
        } catch (_) {}
      }

      window.__milanNativeReady = nativeReady;
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', nativeReady);
      } else {
        nativeReady();
      }
      window.setTimeout(nativeReady, 700);

      window.setTimeout(function () {
        var app = document.getElementById('app');
        if (!app || String(app.innerHTML || '').replace(/\s/g, '')) return;
        nativeReady();
        document.body.classList.remove('app-booting');
        document.body.classList.add('app-ready');
        app.innerHTML =
          '<section style="padding:24px 8px;color:#f4f0e9;font-family:Arial,sans-serif">' +
          '<div style="font-size:12px;color:#ef2430;font-weight:700;letter-spacing:.12em;text-transform:uppercase">AC Milan Club San Pietroburgo</div>' +
          '<h1 style="font-size:28px;margin:10px 0">Не удалось запустить приложение</h1>' +
          '<p style="color:#918e89;line-height:1.5">Нажмите «Повторить». Если экран снова не откроется, обновите Telegram и Android System WebView.</p>' +
          '<button onclick="location.reload()" style="margin-top:12px;width:100%;min-height:50px;border:0;border-radius:16px;background:#d71920;color:white;font-weight:700">ПОВТОРИТЬ</button>' +
          '</section>';
      }, 3200);
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css?v=20260921d" />
</head>
<body class="app-booting">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="На главную">
        <span class="brand-mark brand-logo-wrap"><img class="brand-logo" src="assets/milan-club-logo-dark.webp" alt="Milan Club Saint Petersburg"></span>
        <span class="brand-copy">
          <strong>AC MILAN CLUB</strong>
          <small>SAN PIETROBURGO</small>
        </span>
      </button>
      <button class="profile-chip" data-route="profile" aria-label="Профиль">
        <span class="profile-chip-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12.25a4.15 4.15 0 1 0 0-8.3 4.15 4.15 0 0 0 0 8.3Z"/><path d="M4.8 20c.72-3.43 3.5-5.55 7.2-5.55s6.48 2.12 7.2 5.55"/></svg>
        </span>
        <span class="profile-dot"></span>
        <img class="profile-photo" alt="" hidden>
        <span class="profile-label">Профиль</span>
      </button>
    </header>

    <main id="app" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="nav-item active" data-route="home">
        <span class="nav-icon-shell"><svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.4 12 4l8 6.4V20h-5.2v-5.8H9.2V20H4v-9.6Z"/></svg></span>
        <span>Главная</span>
      </button>
      <button class="nav-item" data-route="matches">
        <span class="nav-icon-shell"><svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M8 3.8v3.4M16 3.8v3.4M4 9.5h16"/></svg></span>
        <span>Матчи</span>
      </button>
      <button class="nav-item nav-main" data-route="watch">
        <span class="nav-main-circle"><svg class="nav-main-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="12.5" rx="3"/><path d="m10.2 9 4.7 2.25-4.7 2.25V9ZM8.5 20h7"/></svg></span>
        <span>Просмотры</span>
      </button>
      <button class="nav-item" data-route="ranking">
        <span class="nav-icon-shell"><svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11h4v8H5Zm5 0V5h4v14h-4Zm5 0v-6h4v6h-4Z"/><path d="M4 20h16"/></svg></span>
        <span>Рейтинг</span>
      </button>
      <button class="nav-item" data-route="more">
        <span class="nav-icon-shell"><svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="2"/><rect x="14" y="4" width="6" height="6" rx="2"/><rect x="4" y="14" width="6" height="6" rx="2"/><rect x="14" y="14" width="6" height="6" rx="2"/></svg></span>
        <span>Меню</span>
      </button>
    </nav>
  </div>

  <script src="telegram.js?v=20260921d"></script>
  <script src="data.js?v=20260921d"></script>
  <script src="app.js?v=20260921d"></script>
</body>
</html>
